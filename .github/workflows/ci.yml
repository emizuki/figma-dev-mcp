name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-static:
    name: rust-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust (Cargo.lock)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-static-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust (Cargo.lock)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ hashFiles('Cargo.lock') }}
      - name: cargo test
        run: cargo test --workspace --all-features

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun (plugin/bun.lock)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            plugin/node_modules
          key: bun-plugin-${{ runner.os }}-${{ hashFiles('plugin/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust (Cargo.lock)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: policy-${{ hashFiles('Cargo.lock') }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun (plugin/bun.lock)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            plugin/node_modules
          key: bun-policy-${{ runner.os }}-${{ hashFiles('plugin/bun.lock') }}
      - name: Production plugin build
        run: |
          cd plugin
          bun install --frozen-lockfile
          bun run build
      - name: Policy test target
        run: cargo test -p figma-dev-mcp-tests --test policy

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Cache Rust (Cargo.lock)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance-${{ hashFiles('Cargo.lock') }}
      - name: Install Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun (conformance/bun.lock)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            conformance/node_modules
          key: bun-conformance-${{ runner.os }}-${{ hashFiles('conformance/bun.lock') }}
      - name: Install conformance runners
        run: |
          cd conformance
          bun install --frozen-lockfile
      - name: Build test adapter and run both pinned official suites
        run: ./scripts/run-conformance.sh
